[workspace]
resolver = "3"
members = ["crates/*", "tools/ss-cli"]
default-members = ["crates/*", "tools/ss-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"

[workspace.dependencies]
ss-geom    = { path = "crates/ss-geom" }
ss-doc     = { path = "crates/ss-doc" }
ss-formats = { path = "crates/ss-formats" }
ss-gpgl    = { path = "crates/ss-gpgl" }
ss-device  = { path = "crates/ss-device" }
ss-config  = { path = "crates/ss-config" }

kurbo     = "0.13"
i_overlay = "9.2"

usvg      = "0.50"
dxf       = "0.6"
flate2    = "1.1"
png       = "0.18"

rusb              = "0.9"
crossbeam-channel = "0.5"
directories       = "6"

eframe = { version = "0.37", features = ["wayland", "x11"] }
egui   = "0.37"
rfd    = "0.18"

serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
toml               = "1.2"
uuid               = { version = "1.29", features = ["v4", "serde"] }
thiserror          = "2"
anyhow             = "1"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { version = "4.6", features = ["derive"] }

proptest = "1.12"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
